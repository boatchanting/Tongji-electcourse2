<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多任务选课系统</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 800px;
            max-width: 100%;
            transition: background-color 0.3s, color 0.3s;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .global-settings {
            border-right: 2px solid #81D4FA;
            padding-right: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
            display: block;
            transition: color 0.3s;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #81D4FA;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s, background-color 0.3s;
        }
        .task-input {
            margin-bottom: 20px;
        }
        .task-input input {
            width: calc(100% - 120px);
            margin-right: 10px;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, #B2EBF2, #81D4FA);
            color: #333;
            font-weight: 500;
            transition: background-color 0.3s, color 0.3s;
            margin: 5px 0;
        }
        button:hover {
            background-color: #81D4FA;
        }
        button:active {
            background-color: #4FC3F7;
        }
        .task-list {
            border-left: 2px solid #81D4FA;
            padding-left: 20px;
        }
        .task-item {
            background-color: #f0f8ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            transition: background-color 0.3s;
            position: relative;
        }
        .task-item button {
            margin-left: 10px;
        }
        .task-status {
            position: absolute;
            right: 15px;
            top: 15px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 2px solid #81D4FA;
            border-radius: 10px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .log-line {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        /* Night Mode Styles */
        body.night-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.night-mode .container {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }
        body.night-mode input[type="text"],
        body.night-mode input[type="password"],
        body.night-mode textarea {
            background-color: #333;
            border-color: #4FC3F7;
            color: #e0e0e0;
        }
        body.night-mode .task-item {
            background-color: #3a3a3a;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
            transition: color 0.3s;
            grid-column: span 2;
        }
        body.night-mode .footer {
            color: #aaa;
        }
        .footer a {
            color: #0078d4;
            text-decoration: none;
        }
        body.night-mode .footer a {
            color: #4FC3F7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="global-settings">
            <div class="form-group">
                <label for="global-username">学号:</label>
                <input type="text" id="global-username" placeholder="请输入学号">
            </div>
            <div class="form-group">
                <label for="global-password">密码:</label>
                <input type="password" id="global-password" placeholder="请输入密码">
            </div>
            <div class="task-input">
                <input type="text" id="course-number" placeholder="请输入课程编号">
                <input type="text" id="max-retries" placeholder="最大重试次数" value="3">
                <button id="add-task">添加任务</button>
            </div>
        </div>
        <div class="task-section">
            <div class="task-list" id="task-list"></div>
            <textarea id="log" readonly>
！！！添加多个任务后，可分别控制每个任务的开始/停止！！！
支持同时运行多个选课任务，所有操作均为本地执行
            </textarea>
        </div>
        <div class="footer">
            该界面仅为展示界面，实际功能需配合后台服务使用
        </div>
    </div>
    <script>
        const taskList = document.getElementById('task-list');
        const logTextarea = document.getElementById('log');
        let taskIdCounter = 1;
        let tasks = {};
        let globalUsername = '';
        let globalPassword = '';

        // 日志格式化函数
        function formatLog(taskId, level, message) {
            const now = new Date();
            const timestamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ` +
                              `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            return `[任务${taskId}] ${timestamp} - ${level} - ${message}\n`;
        }

        // 创建任务项
        function createTaskItem(taskId, courseNumber) {
            const taskItem = document.createElement('div');
            taskItem.className = 'task-item';
            taskItem.innerHTML = `
                <div class="task-info">
                    <div>任务ID: ${taskId}</div>
                    <div>课程号: ${courseNumber}</div>
                </div>
                <div class="task-controls">
                    <button onclick="startTask(${taskId})">开始</button>
                    <button onclick="stopTask(${taskId})">停止</button>
                </div>
                <div class="task-status" id="status-${taskId}">已停止</div>
            `;
            return taskItem;
        }

        // 添加任务事件
        document.getElementById('add-task').addEventListener('click', () => {
            const username = document.getElementById('global-username').value.trim();
            const password = document.getElementById('global-password').value.trim();
            const courseNumber = document.getElementById('course-number').value.trim();
            const maxRetries = parseInt(document.getElementById('max-retries').value) || 3;

            if (!username || !password) {
                alert('请先填写学号和密码');
                return;
            }
            if (!courseNumber) {
                alert('请输入课程编号');
                return;
            }

            // 更新全局凭证
            globalUsername = username;
            globalPassword = password;

            const taskId = taskIdCounter++;
            tasks[taskId] = {
                id: taskId,
                courseNumber,
                maxRetries,
                status: 'stopped',
                currentAttempt: 1,
                timeoutID: null
            };

            const taskItem = createTaskItem(taskId, courseNumber);
            taskList.appendChild(taskItem);
            logTextarea.value += formatLog(taskId, 'INFO', '任务已添加');
            
            // 清空课程编号输入框
            document.getElementById('course-number').value = '';
        });

        // 开始任务
        window.startTask = function(taskId) {
            const task = tasks[taskId];
            if (!task || task.status === 'running') return;

            task.status = 'running';
            document.querySelector(`#status-${taskId}`).textContent = '运行中';
            logTextarea.value += formatLog(taskId, 'INFO', '任务启动');

            const executeStep = (step) => {
                if (step >= 10 || task.status !== 'running') {
                    if (task.status === 'running') {
                        task.currentAttempt++;
                        if (task.currentAttempt > task.maxRetries) {
                            logTextarea.value += formatLog(taskId, 'ERROR', '超过最大重试次数');
                            stopTask(taskId);
                        } else {
                            logTextarea.value += formatLog(taskId, 'INFO', `第${task.currentAttempt}次重试准备`);
                            setTimeout(() => executeStep(0), 1000);
                        }
                    }
                    return;
                }

                const steps = [
                    '正在启动浏览器...',
                    '登录系统...',
                    '跳转选课页面...',
                    '搜索课程...',
                    '尝试选课...',
                    '等待系统响应...',
                    '验证选课结果...',
                    '准备下一次尝试...'
                ];

                logTextarea.value += formatLog(taskId, 'INFO', steps[step]);
                task.timeoutID = setTimeout(() => executeStep(step + 1), Math.random() * 1000 + 500);
            };

            executeStep(0);
        };

        // 停止任务
        window.stopTask = function(taskId) {
            const task = tasks[taskId];
            if (!task || task.status === 'stopped') return;

            task.status = 'stopped';
            document.querySelector(`#status-${taskId}`).textContent = '已停止';
            clearTimeout(task.timeoutID);
            logTextarea.value += formatLog(taskId, 'INFO', '任务已停止');
        };

        // 主题切换
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('night-mode');
        });
    </script>
</body>
</html>
